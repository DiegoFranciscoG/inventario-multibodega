spring:
  application:
    name: inventario-multibodega
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:5}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        # Orden estable de UPDATE/INSERT: evita deadlocks entre transacciones que tocan varios productos
        order_updates: true
        order_inserts: true
  flyway:
    locations: classpath:db/migration
  jackson:
    default-property-inclusion: non_null
  servlet:
    multipart:
      enabled: false
  mvc:
    problemdetails:
      enabled: true

server:
  port: ${PORT:8080}
  forward-headers-strategy: native
  error:
    include-stacktrace: never
    include-message: never
    include-binding-errors: never
    include-exception: false
  tomcat:
    max-http-form-post-size: 64KB

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true

springdoc:
  api-docs:
    enabled: ${APP_SWAGGER_ENABLED:true}
  swagger-ui:
    enabled: ${APP_SWAGGER_ENABLED:true}
    path: /swagger-ui.html
  default-produces-media-type: application/json

app:
  security:
    # Secreto HS256 en Base64 (≥ 32 bytes). Sin valor por defecto: si falta, la aplicación no arranca.
    jwt-secret: ${JWT_SECRET}
    jwt-ttl: ${JWT_TTL:PT30M}
    jwt-issuer: inventario-multibodega
    cors-allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}
    login-attempts-per-minute: ${LOGIN_ATTEMPTS_PER_MINUTE:10}
  inventory:
    expiring-days: ${APP_EXPIRING_DAYS:30}
    export-max-rows: ${APP_EXPORT_MAX_ROWS:20000}
    max-page-size: 100
    time-zone: ${APP_TIME_ZONE:America/Guayaquil}
  bootstrap:
    admin-email: ${ADMIN_EMAIL:}
    admin-password: ${ADMIN_PASSWORD:}
  demo:
    enabled: ${APP_DEMO_ENABLED:false}
    password: ${DEMO_PASSWORD:}

logging:
  level:
    root: INFO
    org.hibernate.SQL: WARN
