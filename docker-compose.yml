# Base de datos local para desarrollo (la misma versión que se usa en los tests y en Neon).
# Uso: docker compose up -d db   (lee DB_USER y DB_PASSWORD de .env)
services:
  db:
    image: postgres:18.6-alpine3.24
    environment:
      POSTGRES_DB: inventario
      POSTGRES_USER: ${DB_USER:?Define DB_USER en .env}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Define DB_PASSWORD en .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d inventario"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
